<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Oswald&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"
        integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
    <script type="js/bootstrap.min.js"></script>
</head>

<body>

    <header>
        <h1>Preetties Dumping</h1>
    </header>
    <div class="head container">
        <!-- Logo -->
        <div class="logo"><a href="#home">
                <img src="img/RS.png" alt="Logo">
            </a></div>
        <div class="search">
            <input type="text" placeholder="Search...">
            <button type="submit"><i class="fa fa-search" aria-hidden="true" style="border: 0ch;"></i></button>
        </div>
        <div class="btn">
            <button class="btn">Any-Thing Interesting</button>
        </div>


    </div>
    <nav class="main-nav">
        <!-- Navigation -->
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">My Portfolio</a></li>
            <li><a href="#">Uploads</a></li>
            <li><a href="#">About Us</a></li>
        </ul>

        <!-- Auth links -->
        <ul class="auth-links">
            <li><a href="#login">Log In</a></li>
            <li><a href="#signup" id="signup">Sign Up</a></li>
        </ul>
    </nav>
    <!-- Signup Form -->
     <section id="signup">
        <div class="sign-up container">
            <form action="" method="post">
                <h2>Sign Up</h2>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
     </section>
    <!-- section4 -->
    <section id="part-5">
        <div class="container-fluid">
            <div class="row h-100">
                <div class="col-4">
                    <img class="bottom-img img-fluid" src="img/RS.png" alt="logo">
                    <div class="icon">
                        <a href=""><i class="fa fa-facebook-official" aria-hidden="true"></i></a>
                        <a href=""><i class="fa fa-instagram" aria-hidden="true"></i></a>
                        <a href=""><i class="fa fa-youtube-play" aria-hidden="true"></i></a>
                    </div>
                </div>
                <div class="col-4">
                    <ul class="nav-links-bottom">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">My Portfolio</a></li>
                        <li><a href="#">Uploads</a></li>
                        <li><a href="#">About Us</a></li>
                    </ul>

                </div>
                <div class="col-4">
                    <div class="email-box">
                        <form action="#POST">
                            <input type="email" placeholder="Enter your email">
                            <button type="submit" class="btn btn-primary">Subscribe</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="footer">
            <p>&copy; 2025 Preetties Dumping. All rights reserved.</p>
        </div>
    </footer>
</body>
<script>
    // Example JavaScript for form validation
    document.querySelector('form').addEventListener('submit', function (e) {
        var username = document.getElementById('username').value;
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;

        if (username.length < 3) {
            alert('Username must be at least 3 characters long.');
            e.preventDefault();
        }

        var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!email.match(emailPattern)) {
            alert('Please enter a valid email address.');
            e.preventDefault();
        }

        if (password.length < 6) {
            alert('Password must be at least 6 characters long.');
            e.preventDefault();
        }
    });
    document.querySelector('form').addEventListener('submit',
    function (h){
        var username = document.getElementById('username').value;
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        if(username!=="Preeti" ){
            alert("Username should be your name only");
            h.preventDefault();
            return;
        }
        if(email!=="preetyshrestha934@gmail.com" ){
            alert("Email should be your personal email only DUMBOOO!!!");
            h.preventDefault();
            return;
        }
        if(password!=="iloveyou" ){
            alert("Password should be the three magical words that you say to ME");
            h.preventDefault();
            return;
        }
        alert("Registration Successful! Welcome aboard, Preeti! I Love you Very much");
        window.location.href="index.html";
    });
    if(window.location.pathname==="signup.html"){
        document.getElementById("signup").style.display="none";
    }
</script>
</html>
